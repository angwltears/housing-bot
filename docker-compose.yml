
name: housing-bot
services:
    redis:
        image: redis:7-alpine
        restart: always
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
    app_bot:
        build: .
        restart: always
        depends_on:
            - redis
        environment:
            WGGESHUCHT_URL: ${WGGESHUCHT_URL}
            KLEINANZEIGEN_URL: ${KLEINANZEIGEN_URL}
            REDIS_URL: ${REDIS_URL}
            TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
volumes:
  redis_data:

